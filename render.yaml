# Render Blueprint — JobHunter V2
# Docs: https://render.com/docs/blueprint-spec
# Region: oregon (us-west) — closest default; change to singapore if colocating with Supabase ap-southeast-2.
# Secrets are NOT committed here. Set them in Render Dashboard → Environment.
# Required secrets (set manually): PG_DATABASE_STRING (or DATABASE_URL), JWT_SECRET,
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, JOOBLE_API_KEY,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SAGEMAKER_ENDPOINT_NAME,
#   ADZUNA_APP_ID, ADZUNA_APP_KEY, JOBSPIPE_API_KEY

services:
  # ---------------------------------------------------------------------------
  # Backend — Node.js API (Express + TypeScript)
  # ---------------------------------------------------------------------------
  - type: web
    name: jobhunter-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    branch: dev
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    # Alternative health path (also served): /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PG_SSL
        value: true
      # ---- Secrets — set in dashboard, sync:false prevents blueprint overwrite
      - key: PG_DATABASE_STRING
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_RESUME_BUCKET
        value: resumes
      - key: JOOBLE_API_KEY
        sync: false
      - key: JOOBLE_MAX_QUERIES_PER_REFRESH
        value: 4
      - key: JOOBLE_CALL_BUDGET
        value: 450
      - key: JOB_PROVIDERS
        value: jooble,jobspipe,adzuna,remotive,arbeitnow
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: in
      - key: ADZUNA_RESULTS_PER_PAGE
        value: 15
      - key: ADZUNA_CALL_BUDGET
        value: 100
      - key: JOBSPIPE_API_KEY
        sync: false
      - key: JOBSPIPE_COUNTRY
        value: IN
      - key: JOBSPIPE_LIMIT
        value: 15
      - key: JOBSPIPE_MONTHLY_BUDGET
        value: 1000
      - key: REMOTIVE_DAILY_BUDGET
        value: 4
      - key: ARBEITNOW_CACHE_HOURS
        value: 12
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: jobhunter_session
      - key: SESSION_TTL_DAYS
        value: 7
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_SAGEMAKER_ENDPOINT_NAME
        sync: false
      - key: EMBEDDING_MODEL_ID
        value: anass1209/resume-job-matcher-all-MiniLM-L6-v2
      - key: PYTHON_SERVICE_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend — Vite React SPA (static site)
  # Render requires `type: web` + `runtime: static` for static sites
  # Static sites cannot have `region` (Render picks automatically)
  # ---------------------------------------------------------------------------
  - type: web
    name: jobhunter
    runtime: static
    branch: dev
    rootDir: frontend/project
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    # SPA fallback — required for react-router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      # Legacy alias still read by some builds; keep in sync
      - key: VITE_API_URL
        sync: false
